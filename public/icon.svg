<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b1b10" />
      <stop offset="100%" stop-color="#16120e" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="100%" stop-color="#e09100" />
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b4631e" />
      <stop offset="45%" stop-color="#f2b25c" />
      <stop offset="100%" stop-color="#8a4412" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)" />
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="url(#gold)" stroke-width="10" opacity="0.7" />
  <!-- Chef Hat -->
  <g transform="translate(136, 56)">
    <path d="M40 118 C10 112, 4 64, 42 46 C56 12, 184 12, 198 46 C236 64, 230 112, 200 118 Z" fill="#f8fafc" stroke="#1e293b" stroke-width="10" stroke-linejoin="round" />
    <rect x="44" y="114" width="152" height="44" rx="12" fill="#e2e8f0" stroke="#1e293b" stroke-width="10" />
    <line x1="88" y1="48" x2="88" y2="108" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
    <line x1="120" y1="38" x2="120" y2="108" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
    <line x1="152" y1="48" x2="152" y2="108" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
  </g>
  <!-- Copper Ful Pot (Qidra) -->
  <g transform="translate(116, 224)">
    <ellipse cx="140" cy="142" rx="104" ry="84" fill="url(#pot)" stroke="#2b1508" stroke-width="10" />
    <rect x="74" y="22" width="132" height="44" rx="16" fill="url(#pot)" stroke="#2b1508" stroke-width="10" />
    <ellipse cx="140" cy="24" rx="74" ry="16" fill="#ffd54f" stroke="#2b1508" stroke-width="8" />
    <!-- Ful Steam -->
    <path d="M108 -6 Q96 -28 112 -46" fill="none" stroke="#fde68a" stroke-width="9" stroke-linecap="round" opacity="0.85" />
    <path d="M140 -12 Q128 -36 144 -56" fill="none" stroke="#fde68a" stroke-width="9" stroke-linecap="round" opacity="0.9" />
    <path d="M172 -6 Q160 -28 176 -46" fill="none" stroke="#fde68a" stroke-width="9" stroke-linecap="round" opacity="0.85" />
  </g>
  <!-- Egyptian Flag Accent Ribbon -->
  <g transform="translate(156, 440)">
    <rect x="0" y="0" width="200" height="10" rx="3" fill="#ce1126" />
    <rect x="0" y="10" width="200" height="10" rx="3" fill="#ffffff" />
    <rect x="0" y="20" width="200" height="10" rx="3" fill="#111111" />
    <polygon points="100,11 104,15 100,19 96,15" fill="#c09300" />
  </g>
